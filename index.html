<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안녕</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e0d8;
      --card: #fffdf9;
      --accent: #c2410c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, #fde7d6, transparent 60%),
        var(--bg);
      color: var(--ink);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }

    p.kicker {
      margin: 0 0 16px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 20px 0 0;
      max-width: 34em;
      font-size: 18px;
      line-height: 1.6;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 48px;
    }

    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }

    article h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    article p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    footer {
      margin-top: 56px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">single file</p>
    <h1>간단한 페이지</h1>
    <p class="lead">
      CSS와 내용이 이 파일 하나에 들어 있습니다.
      브라우저로 바로 열면 됩니다.
    </p>
    <div class="grid">
      <article>
        <h2>파일 하나</h2>
        <p>빌드나 서버 없이 index.html만 있으면 동작합니다.</p>
      </article>
      <article>
        <h2>바로 수정</h2>
        <p>제목, 문장, 색은 style 블록에서 바꾸면 됩니다.</p>
      </article>
      <article>
        <h2>반응형</h2>
        <p>좁은 화면에서는 카드가 한 줄로 쌓입니다.</p>
      </article>
    </div>
    <footer>sin / index.html</footer>
  </main>
</body>
</html>
